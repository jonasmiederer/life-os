name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks (full history and tree)
        run: |
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Generic privacy scan (no deny list in CI)
        run: python3 scripts/privacy_scan.py --tree --no-denylist
