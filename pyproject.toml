# Tool config and dev dependencies: P0-2. [project] and the `lifeos` entry point: P0-3.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.0.1"
description = "life-os core: note store, validation, runtime basics"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
lifeos = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20260408",
]
sast = ["bandit==1.9.4", "semgrep==1.186.0"]
deps = ["pip-audit==2.10.0"]
workflow = ["zizmor==1.26.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
# privacy_scan.py belongs to P0-1: stdlib script, not held to these rules.
extend-exclude = ["tests/fixtures", "scripts/privacy_scan.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["scripts", "tests", "evals"]
strict = true
exclude = ["tests/fixtures/", "scripts/privacy_scan.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["security: security tests (injection corpus, egress deny, canary)"]
