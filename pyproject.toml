# Tool config and dev dependencies only. The [project] table and the `lifeos`
# entry point belong to P0-3 and are added there.

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20260408",
]
sast = ["bandit==1.9.4", "semgrep==1.163.0"]
deps = ["pip-audit==2.10.0"]
workflow = ["zizmor==1.32.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
# privacy_scan.py belongs to P0-1: stdlib script, not held to these rules.
extend-exclude = ["tests/fixtures", "scripts/privacy_scan.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["scripts", "tests", "evals"]
strict = true
exclude = ["tests/fixtures/", "scripts/privacy_scan.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["security: security tests (injection corpus, egress deny, canary)"]
