# core and ntfy sit on an internal network (no internet route).
# web publishes one port on 127.0.0.1 only. The VPN and HTTPS proxy sit in front (D2).
services:
  core:
    build: .
    image: lifeos-core:dev
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      LIFEOS_DATA_DIR: /data
      LIFEOS_NTFY_URL: http://ntfy:8080
    volumes:
      - ${LIFEOS_DATA_DIR:-./data}:/data
    tmpfs:
      - /tmp
    networks: [internal]
    depends_on:
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "lifeos", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: .
    image: lifeos-core:dev
    entrypoint: ["python", "-m", "core.web"]
    command: ["serve"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    environment:
      LIFEOS_DATA_DIR: /data
      LIFEOS_PASSWORD_HASH_FILE: /run/secrets/web_password_hash
      LIFEOS_SESSION_MINUTES: "30"
      LIFEOS_NTFY_URL: http://ntfy:8080
    secrets: [web_password_hash]
    ports:
      - "127.0.0.1:${LIFEOS_WEB_PORT:-8080}:8080"
    volumes:
      - ${LIFEOS_DATA_DIR:-./data}:/data
    tmpfs:
      - /tmp
    networks: [edge, internal]  # internal: reaches ntfy for deadline pushes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/login')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    tmpfs:
      - /var/cache/ntfy:mode=1777
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mail watcher (design 2.14). Reads one IMAP folder, writes only inbox/. No send path in the code.
  # Shortcut (v1): Docker cannot limit egress to one host, so this service has an open outbound
  # network. The IMAP host is config. A firewall or egress proxy is a later work item.
  ingest-mail:
    build: .
    image: lifeos-core:dev
    entrypoint: ["python", "-m", "core.mailwatch"]
    profiles: ["mail"]  # off until the owner sets up the mailbox: docker compose --profile mail up
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: on-failure:5
    environment:
      LIFEOS_DATA_DIR: /data
      LIFEOS_NTFY_URL: http://ntfy:8080
      LIFEOS_MAIL_PASSWORD_FILE: /run/secrets/mail_password
      LIFEOS_MAIL_IMAP_HOST: ${LIFEOS_MAIL_IMAP_HOST:-}
      LIFEOS_MAIL_USER: ${LIFEOS_MAIL_USER:-}
      LIFEOS_MAIL_INGEST_ADDRESS: ${LIFEOS_MAIL_INGEST_ADDRESS:-}
      LIFEOS_MAIL_AUTHSERV_ID: ${LIFEOS_MAIL_AUTHSERV_ID:-}
      LIFEOS_MAIL_ALLOWED_FROM: ${LIFEOS_MAIL_ALLOWED_FROM:-}
      LIFEOS_MAIL_ALLOWED_DOMAINS: ${LIFEOS_MAIL_ALLOWED_DOMAINS:-}
      LIFEOS_MAIL_FOLDER: ${LIFEOS_MAIL_FOLDER:-INBOX}
      LIFEOS_MAIL_PROCESSED: ${LIFEOS_MAIL_PROCESSED:-Processed}
      LIFEOS_MAIL_REJECTED: ${LIFEOS_MAIL_REJECTED:-Rejected}
    secrets: [mail_password]
    volumes:
      - ${LIFEOS_DATA_DIR:-./data}/inbox:/data/inbox
    tmpfs:
      - /tmp
    networks: [internal, mailout]  # internal: ntfy only. mailout: the IMAP server.

# Shortcut: web has an internet route until the gateway work item adds an egress-deny proxy.
# web picks the Kiro backend only when a key and LIFEOS_KIRO_MODEL are set (else no cloud call).
# The image has no kiro-cli yet: a key without it fails per call as BackendUnavailable.
secrets:
  mail_password:
    file: ${LIFEOS_MAIL_PASSWORD_FILE:-./secrets/mail_password}
  web_password_hash:
    file: ${LIFEOS_WEB_PASSWORD_HASH_FILE:-./secrets/web_password_hash}

networks:
  internal:
    internal: true
  edge: {}
  mailout: {}
